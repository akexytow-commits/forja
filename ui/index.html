<!doctype html>
<html lang="es" data-theme="oscuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FORJA</title>
  <link rel="stylesheet" href="/ui/styles.css">
  <link rel="stylesheet" href="/ui/tareas.css">
  <link rel="stylesheet" href="/ui/seguridad.css">
  <link rel="stylesheet" href="/ui/academia.css">
  <link rel="stylesheet" href="/ui/rama5.css">
  <link rel="stylesheet" href="/ui/rama6.css">
  <link rel="stylesheet" href="/ui/verificador.css">
  <link rel="stylesheet" href="/ui/estudio.css">
  <script>window.FORJA_TOKEN = "__FORJA_TOKEN__";</script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-yunque" viewBox="0 0 24 24"><path d="M3 7h13c0 2.8 2.2 4 5 4v1c-3 0-5 1.2-6 3l1 3H8l1-3C7.2 13.8 5 13 3 11z" fill="currentColor"/><path d="M6 21h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-paleta" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-1 2-2 0-1.4-1.2-1.7-1.2-2.9 0-1 .8-1.6 1.9-1.6H17a4 4 0 0 0 4-4C21 6.4 17 3 12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="7.5" cy="11" r="1.4" fill="currentColor"/><circle cx="10" cy="7" r="1.4" fill="currentColor"/><circle cx="14.5" cy="7" r="1.4" fill="currentColor"/></symbol>
    <symbol id="i-codigo" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 5l-3 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-escudo" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-tareas" viewBox="0 0 24 24"><path d="M4 6l1.5 1.5L8 5M4 12l1.5 1.5L8 11M4 18l1.5 1.5L8 17M11 6h9M11 12h9M11 18h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sol" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-luna" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-enviar" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-parar" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-engranaje" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="15" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-nube" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.2 9.1 4.5 4.5 0 0 0 7 18z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3v2H7v-2l3-3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 15v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-puntos" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="18" cy="12" r="1.7" fill="currentColor"/></symbol>
    <symbol id="i-chispa" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" fill="currentColor"/></symbol>
    <symbol id="i-candado" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-carpeta" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-plantilla" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 9h16M9 9v11" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-exportar" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-flecha" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <div class="app">
    <header class="topbar">
      <div class="marca">
        <svg class="marca-icono"><use href="#i-yunque"/></svg>
        <span id="app-nombre">FORJA</span>
      </div>
      <nav class="modos" id="modos" role="tablist" aria-label="Modo"></nav>
      <div class="topbar-der">
        <button class="chip-estado" id="chip-estado" type="button">
          <span class="punto"></span><span class="chip-txt" id="chip-txt">…</span>
        </button>
        <button class="icono-btn" id="btn-ajustes" type="button"><svg><use href="#i-engranaje"/></svg></button>
        <button class="icono-btn" id="btn-estudio" type="button"><svg><use href="#i-paleta"/></svg></button>
        <button class="icono-btn" id="btn-tema" type="button"><svg><use href="#i-luna"/></svg></button>
      </div>
    </header>

    <main class="area" id="area">
      <!-- SCR-010 Chat Scripts/Firmware -->
      <section class="vista" data-vista="scripts">
        <aside class="hilos" id="hilos" aria-label="Hilos">
          <div class="hilos-cab">
            <span data-t="hilos.titulo"></span>
            <button class="icono-btn peq" id="btn-nuevo-hilo" type="button"><svg><use href="#i-mas"/></svg></button>
          </div>
          <ul class="hilos-lista" id="hilos-lista"></ul>
        </aside>
        <div class="chat">
          <div class="chat-barra">
            <button class="icono-btn peq" id="btn-hilos" type="button" aria-expanded="false"><svg><use href="#i-menu"/></svg></button>
            <span class="chat-titulo" id="chat-titulo"></span>
            <!-- SCR-011 Proyectos (SC1 = desplegable) · BTN-032 Plantillas · BTN-060 Exportar -->
            <div class="barra-acc">
              <div class="pop-ancla">
                <button class="boton-txt peq chip-proy" id="btn-proyecto" type="button" aria-expanded="false"><svg><use href="#i-carpeta"/></svg><span id="btn-proyecto-txt"></span><svg class="flecha"><use href="#i-flecha"/></svg></button>
                <div class="pop" id="pop-proyectos" hidden>
                  <div class="pop-cab"><strong data-t="proy.titulo"></strong><button class="boton-txt peq" type="button" id="proy-nuevo"><svg><use href="#i-mas"/></svg><span data-t="proy.nuevo"></span></button></div>
                  <ul class="pop-lista" id="proy-lista"></ul>
                  <p class="pop-nota" id="proy-nota"></p>
                </div>
              </div>
              <div class="pop-ancla">
                <button class="boton-txt peq" id="btn-plantillas" type="button" aria-expanded="false"><svg><use href="#i-plantilla"/></svg><span data-t="plant.boton"></span></button>
                <div class="pop" id="pop-plantillas" hidden>
                  <div class="pop-cab"><strong data-t="plant.titulo"></strong></div>
                  <ul class="pop-lista" id="plant-lista"></ul>
                  <button class="boton-txt peq pop-pie" type="button" id="plant-carpeta"><svg><use href="#i-carpeta"/></svg><span data-t="plant.carpeta"></span></button>
                </div>
              </div>
              <button class="icono-btn peq" id="btn-exportar" type="button"><svg><use href="#i-exportar"/></svg></button>
            </div>
            <button class="boton-txt" id="btn-nuevo-hilo-2" type="button"><svg><use href="#i-mas"/></svg><span data-t="hilos.nuevo"></span></button>
          </div>
          <div class="mensajes" id="mensajes"></div>
        </div>
      </section>

      <!-- Modo Seguridad (MOD-030) — Rama 4 -->
      <section class="vista" data-vista="seguridad">
        <!-- FR-035 Enfoque + Actividad (Trabajo = bug bounty autorizado · Aprender = Academia, Rama 4b) -->
        <div class="ac-barra" id="ac-barra">
          <div class="seg" role="radiogroup" id="ac-actividad">
            <button type="button" role="radio" data-v="trabajo" data-t="aca.act.trabajo"></button>
            <button type="button" role="radio" data-v="aprender" data-t="aca.act.aprender"></button>
          </div>
          <div class="seg" role="radiogroup" id="ac-enfoque">
            <button type="button" role="radio" data-v="ofensivo" data-t="aca.enf.ofensivo"></button>
            <button type="button" role="radio" data-v="defensivo" data-t="aca.enf.defensivo"></button>
          </div>
          <nav class="ac-nav" id="ac-nav" role="tablist" hidden>
            <button type="button" class="ac-nav-b" data-vista="rutas" data-t="aca.nav.rutas"></button>
            <button type="button" class="ac-nav-b" data-vista="leccion" data-t="aca.nav.leccion"></button>
            <button type="button" class="ac-nav-b" data-vista="progreso" data-t="aca.nav.progreso"></button>
            <button type="button" class="ac-nav-b" data-vista="lab" data-t="aca.nav.lab"></button>
          </nav>
        </div>

        <!-- Academia (MOD-090 / MOD-091) -->
        <div class="ac-raiz" id="ac-raiz" hidden>
          <!-- SCR-024 enfoque, rutas y gate de laboratorio -->
          <div class="ac-vista" data-vista="rutas">
            <div class="ac-scroll">
              <div class="ac-lab-gate" id="ac-lab-gate"></div>
              <p class="ac-intro" data-t="aca.rutas.intro"></p>
              <div class="ac-rutas" id="ac-rutas"></div>
            </div>
          </div>
          <!-- SCR-025 lección guiada + copiloto -->
          <div class="ac-vista" data-vista="leccion" hidden>
            <div class="ac-leccion">
              <div class="ac-scroll ac-lec-main" id="ac-lec-main"></div>
              <aside class="ac-lado" id="ac-lado-leccion"></aside>
            </div>
          </div>
          <!-- SCR-026 progreso y árbol de herramientas -->
          <div class="ac-vista" data-vista="progreso" hidden>
            <div class="ac-scroll" id="ac-progreso"></div>
          </div>
          <!-- SCR-027 Laboratorio Linux + copiloto -->
          <div class="ac-vista" data-vista="lab" hidden>
            <div class="ac-leccion">
              <div class="ac-scroll" id="ac-lab"></div>
              <aside class="ac-lado" id="ac-lado-lab"></aside>
            </div>
          </div>
          <!-- Copiloto de Laboratorio (FR-075/076): un único panel que se coloca en la lección o en el laboratorio -->
          <div class="ac-copi" id="ac-copi" hidden>
            <div class="ac-copi-cab"><svg><use href="#i-chispa"/></svg><strong data-t="aca.copi.titulo"></strong><span class="ac-copi-ctx" id="ac-copi-ctx"></span></div>
            <div class="ac-copi-msgs" id="ac-copi-msgs"></div>
            <div class="ac-copi-acc">
              <button type="button" class="boton-txt peq" id="ac-copi-sig" data-t="aca.copi.siguiente"></button>
              <button type="button" class="boton-txt peq" id="ac-copi-exp" data-t="aca.copi.explicar"></button>
            </div>
            <div class="ac-copi-entrada">
              <textarea id="ac-copi-txt" rows="3" spellcheck="false" data-t-ph="aca.copi.ph"></textarea>
              <button type="button" class="boton peq" id="ac-copi-enviar"><svg><use href="#i-enviar"/></svg></button>
            </div>
            <p class="sg-msg" id="ac-copi-msg" hidden></p>
          </div>
        </div>

        <!-- SCR-020 Alcance y autorización (GATE, pantalla completa — SG1) -->
        <div class="sg-gate" id="sg-gate" hidden>
          <div class="sg-gate-in">
            <header class="sg-gate-cab">
              <svg class="sg-escudo"><use href="#i-escudo"/></svg>
              <div>
                <h2 data-t="seg.gate.titulo"></h2>
                <p data-t="seg.gate.sub"></p>
              </div>
            </header>
            <div class="sg-gate-grid">
              <form class="sg-gate-form" id="sg-gate-form" autocomplete="off">
                <h3 id="sg-gate-h3"></h3>
                <!-- SG1 = asistente: 1 Alcance → 2 Reglas → 3 Autorización (data-paso). Pantalla completa: todo a la vez. -->
                <ol class="sg-pasos" id="sg-pasos" aria-label="Pasos">
                  <li data-n="1"><span class="n">1</span><span data-t="seg.paso.1"></span></li>
                  <li data-n="2"><span class="n">2</span><span data-t="seg.paso.2"></span></li>
                  <li data-n="3"><span class="n">3</span><span data-t="seg.paso.3"></span></li>
                </ol>
                <label data-paso="1"><span data-t="seg.gate.nombre"></span><input id="sg-nombre" type="text" maxlength="120" data-t-ph="seg.gate.nombre_ph"></label>
                <label data-paso="1"><span data-t="seg.gate.alcance"></span>
                  <textarea id="sg-alcance" rows="5" spellcheck="false" data-t-ph="seg.gate.alcance_ph"></textarea></label>
                <div class="sg-chips" id="sg-alcance-previa" data-paso="1"></div>
                <label data-paso="1"><span data-t="seg.gate.notas"></span><textarea id="sg-notas" rows="2" spellcheck="false" data-t-ph="seg.gate.notas_ph"></textarea></label>
                <p class="sg-paso-ayuda" data-paso="2" data-solo-asistente data-t="seg.paso.2.ayuda"></p>
                <ul class="sg-reglas" data-paso="2">
                  <li data-t="seg.regla.1"></li><li data-t="seg.regla.2"></li><li data-t="seg.regla.3"></li><li data-t="seg.regla.4"></li>
                </ul>
                <div class="sg-resumen" id="sg-resumen" data-paso="3" data-solo-asistente></div>
                <label class="sg-declaro" data-paso="3"><input type="checkbox" id="sg-declaro"><span data-t="seg.gate.declaro"></span></label>
                <p class="sg-msg" id="sg-gate-msg" hidden></p>
                <div class="sg-gate-acc">
                  <button class="boton-txt" type="button" id="sg-cancelar-ed" data-t="seg.gate.cancelar" hidden></button>
                  <button class="boton-txt" type="button" id="sg-atras" data-t="seg.paso.atras" hidden></button>
                  <button class="boton" type="button" id="sg-siguiente" data-t="seg.paso.siguiente" hidden></button>
                  <button class="boton" type="submit" id="sg-entrar"><svg><use href="#i-escudo"/></svg><span data-t="seg.gate.entrar"></span></button>
                </div>
              </form>
              <aside class="sg-gate-lista">
                <h3 data-t="seg.gate.engagements"></h3>
                <ul id="sg-lista"></ul>
              </aside>
            </div>
          </div>
        </div>

        <!-- Engagement operando: SCR-021/022/023 + chat -->
        <div class="sg-trabajo" id="sg-trabajo" hidden>
          <div class="sg-cab">
            <svg class="sg-escudo peq"><use href="#i-escudo"/></svg>
            <div class="sg-cab-txt">
              <strong id="sg-eng-nombre"></strong>
              <div class="sg-chips" id="sg-eng-alcance"></div>
            </div>
            <button class="boton-txt" type="button" id="sg-editar-alcance" data-t="seg.cab.editar"></button>
            <button class="boton-txt" type="button" id="sg-salir" data-t="seg.cab.salir"></button>
          </div>
          <nav class="sg-tabs" role="tablist">
            <button class="sg-tab" type="button" role="tab" data-tab="chat"><span data-t="seg.tab.chat"></span></button>
            <button class="sg-tab" type="button" role="tab" data-tab="analisis"><span data-t="seg.tab.analisis"></span></button>
            <button class="sg-tab" type="button" role="tab" data-tab="hallazgos"><span data-t="seg.tab.hallazgos"></span> <span class="n"></span></button>
            <button class="sg-tab" type="button" role="tab" data-tab="informe"><span data-t="seg.tab.informe"></span></button>
          </nav>
          <div class="sg-panel sg-panel-chat" data-tab="chat" id="sg-chat"></div>

          <div class="sg-panel" data-tab="analisis" hidden>
            <div class="sg-scroll">
              <p class="sg-ayuda" data-t="seg.analisis.ayuda"></p>
              <textarea id="sg-recon" class="sg-recon" spellcheck="false" data-t-ph="seg.analisis.ph"></textarea>
              <div class="sg-fila-acc">
                <span class="sg-n" id="sg-recon-n"></span>
                <input type="file" id="sg-archivo" hidden accept=".txt,.log,.json,.xml,.csv,.md,.har,.nmap,.gnmap,text/*">
                <button class="boton-txt" type="button" id="sg-importar" data-t="seg.analisis.importar"></button>
                <button class="boton" type="button" id="sg-analizar"><svg><use href="#i-chispa"/></svg><span data-t="seg.analisis.analizar"></span></button>
              </div>
              <p class="sg-msg" id="sg-analisis-msg" hidden></p>
              <div id="sg-resultado"></div>
            </div>
          </div>

          <div class="sg-panel" data-tab="hallazgos" hidden>
            <div class="sg-scroll">
              <div class="sg-fila-acc izq">
                <button class="boton-txt" type="button" id="sg-nuevo-manual"><svg><use href="#i-mas"/></svg><span data-t="seg.f.manual"></span></button>
              </div>
              <form class="sg-manual" id="sg-manual" hidden>
                <input name="titulo" type="text" maxlength="200" data-t-ph="seg.f.titulo_ph">
                <div class="sg-manual-fila">
                  <input name="clase" type="text" maxlength="80" data-t-ph="seg.f.clase_ph">
                  <select name="sev"><option value="" data-t="seg.f.sev_nd"></option><option value="critica" data-t="seg.sev.critica"></option><option value="alta" data-t="seg.sev.alta"></option><option value="media" data-t="seg.sev.media"></option><option value="baja" data-t="seg.sev.baja"></option><option value="info" data-t="seg.sev.info"></option></select>
                </div>
                <textarea name="donde" rows="2" data-t-ph="seg.f.donde_ph"></textarea>
                <textarea name="evidencia" rows="2" data-t-ph="seg.f.evidencia_ph"></textarea>
                <p class="sg-msg" id="sg-manual-msg" hidden></p>
                <div class="sg-fila-acc"><button class="boton-txt" type="button" id="sg-manual-cancelar" data-t="tareas.ed.cancelar"></button><button class="boton" type="submit" data-t="seg.f.anadir"></button></div>
              </form>
              <p class="sg-vacio" id="sg-hallazgos-vacio" data-t="seg.f.vacio"></p>
              <table class="sg-tabla" id="sg-tabla">
                <thead><tr><th data-t="seg.col.sev"></th><th data-t="seg.col.titulo"></th><th data-t="seg.col.clase"></th><th data-t="seg.col.estado"></th><th data-t="seg.col.origen"></th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>

          <div class="sg-panel" data-tab="informe" hidden>
            <div class="sg-scroll">
              <p class="sg-vacio" id="sg-inf-vacio" data-t="seg.inf.vacio"></p>
              <div class="sg-inf" id="sg-inf-cuerpo">
                <div class="sg-inf-izq">
                  <label><span data-t="seg.inf.hallazgo"></span><select id="sg-inf-sel"></select></label>
                  <!-- API-055 / SG3: plantilla del informe (la misma que en Ajustes › Interfaces) -->
                  <label><span data-t="seg.inf.plantilla"></span><select id="sg-inf-plantilla"></select></label>
                  <p class="sg-ayuda" id="sg-inf-plantilla-nota" hidden></p>
                  <h4 data-t="seg.f.evidencia"></h4>
                  <pre class="sg-evid" id="sg-inf-evidencia"></pre>
                  <div class="sg-enfoques" id="sg-enfoques"></div>
                  <button class="boton-txt peq" type="button" id="sg-inf-mas"><svg><use href="#i-mas"/></svg><span data-t="seg.inf.mas"></span></button>
                  <button class="boton" type="button" id="sg-inf-generar"><svg><use href="#i-chispa"/></svg><span></span></button>
                  <p class="sg-ayuda" data-t="seg.inf.ayuda"></p>
                </div>
                <div class="sg-inf-der">
                  <div class="sg-fila-acc">
                    <button class="boton-txt peq" type="button" id="sg-inf-toggle"></button>
                    <span class="sep"></span>
                    <button class="boton-txt peq" type="button" id="sg-inf-copiar" data-t="seg.inf.copiar"></button>
                    <button class="boton-txt peq" type="button" id="sg-inf-guardar" data-t="seg.inf.guardar"></button>
